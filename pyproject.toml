[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentatlas"
version = "0.1.0"
description = "Synthetic shadow AI agent discovery, identity governance, effective access, delegation, and permission-drift platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["agentatlas*"]
