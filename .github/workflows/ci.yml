name: AgentAtlas CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-api.txt -r requirements-dashboard.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run report
        run: python -m agentatlas.cli > /tmp/agentatlas-report.json
      - name: Compile modules
        run: python -m py_compile agentatlas/*.py api/app.py dashboard/app.py
      - name: Smoke test FastAPI
        run: |
          set -euo pipefail
          uvicorn api.app:app --host 127.0.0.1 --port 8000 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          healthy=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then healthy=1; break; fi
            sleep 0.5
          done
          test "$healthy" -eq 1
      - name: Smoke test Streamlit
        run: |
          set -euo pipefail
          streamlit run dashboard/app.py --server.headless true --server.port 8501 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          healthy=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then healthy=1; break; fi
            sleep 0.5
          done
          test "$healthy" -eq 1
      - name: Build and smoke test Docker image
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          docker build -t agentatlas-ci .
          docker run --rm -d --name agentatlas-ci-run -p 8001:8000 agentatlas-ci
          trap 'docker rm -f agentatlas-ci-run >/dev/null 2>&1 || true' EXIT
          healthy=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null; then healthy=1; break; fi
            sleep 0.5
          done
          test "$healthy" -eq 1
