name: AgentAtlas CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-api.txt -r requirements-dashboard.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run report
        run: python -m agentatlas.cli > /tmp/agentatlas-report.json
      - name: Compile modules
        run: python -m py_compile agentatlas/*.py api/app.py dashboard/app.py
      - name: Smoke test FastAPI
        run: |
          uvicorn api.app:app --host 127.0.0.1 --port 8000 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/health && break; sleep 0.5; done
      - name: Smoke test Streamlit
        run: |
          streamlit run dashboard/app.py --server.headless true --server.port 8501 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8501/_stcore/health && break; sleep 0.5; done
      - name: Build Docker image
        if: matrix.python-version == '3.12'
        run: docker build -t agentatlas-ci .
